<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5efe2">
<title>福鼎少年学化学 · 必修一（单文件版）</title>
<style>
/* 福鼎少年学地理 · 纸墨手账风 · 移动优先 */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { -webkit-text-size-adjust:100%; }
:root {
  --paper:#f5efe2; --paper2:#efe6d2; --card:#fffdf6; --ink:#322c26; --ink2:#6b6154;
  --line:#d8ccb4; --red:#b5432f; --gold:#a8842c;
  --ch1:#b5544a; --ch2:#41679c; --ch3:#2f7f8f; --ch4:#a8793a; --ch5:#6d9a3f; --ch6:#8a5aa5;
  --radius:14px;
}
body {
  background:var(--paper);
  color:var(--ink);
  font:16px/1.75 "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background-image:radial-gradient(#00000008 1px, transparent 1px);
  background-size:22px 22px;
  padding-bottom:72px; /* tabbar */
}
.kai { font-family:"KaiTi","STKaiti","楷体","FZKai-Z03S",serif; }

/* ===== 顶栏 ===== */
.topbar { position:sticky; top:0; z-index:30; background:linear-gradient(var(--paper) 82%, transparent);
  padding:14px 16px 10px; display:flex; align-items:center; gap:10px; }
.topbar .seal { width:38px; height:38px; border-radius:9px; background:var(--red); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:19px; flex:none;
  box-shadow:1px 2px 0 #00000022; font-family:"KaiTi","楷体",serif; }
.topbar h1 { font-family:"KaiTi","楷体",serif; font-size:20px; letter-spacing:1px; flex:1; min-width:0; }
.topbar h1 small { display:block; font-family:inherit; font-size:11px; color:var(--ink2); letter-spacing:2px; }
.topbar .back { font-size:22px; line-height:1; color:var(--ink); text-decoration:none; padding:4px 8px 4px 0; }

#app { max-width:760px; margin:0 auto; padding:0 14px; }
.boot-note { text-align:center; padding:80px 0; color:var(--ink2); }

/* ===== 首页 ===== */
.hero { background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius);
  padding:18px 16px 14px; margin:6px 0 14px; box-shadow:3px 3px 0 #00000018; position:relative; overflow:hidden; }
.hero::after { content:"福鼎限定"; position:absolute; top:12px; right:-30px; transform:rotate(35deg);
  background:var(--red); color:#fff; font-size:11px; padding:3px 34px; letter-spacing:2px; }
.hero .h-row { display:flex; gap:14px; align-items:stretch; }
.hero .ring { flex:none; }
.hero h2 { font-family:"KaiTi","楷体",serif; font-size:22px; letter-spacing:1px; }
.hero p.sub { font-size:13px; color:var(--ink2); margin-top:2px; }
.hero .stats { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.hero .st { background:var(--paper2); border-radius:9px; padding:4px 10px; font-size:12px; color:var(--ink); border:1px solid var(--line); }
.hero .st b { font-size:14px; color:var(--red); }
.hero .tip { margin-top:10px; font-size:13px; color:var(--ink2); }

.sec-title { font-family:"KaiTi","楷体",serif; font-size:18px; margin:20px 2px 10px; letter-spacing:1px;
  display:flex; align-items:baseline; gap:8px; }
.sec-title::after { content:""; flex:1; border-top:1px dashed var(--line); transform:translateY(-4px); }
.sec-title small { color:var(--ink2); font-size:12px; font-family:sans-serif; }

.ch-grid { display:grid; grid-template-columns:1fr; gap:12px; }
@media (min-width:640px){ .ch-grid { grid-template-columns:1fr 1fr; } .home-side{display:grid;} }
.chcard { display:flex; gap:12px; align-items:center; text-decoration:none; color:var(--ink);
  background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius); padding:14px;
  box-shadow:3px 3px 0 #00000015; position:relative; transition:transform .08s; }
.chcard:active { transform:translate(1px,1px); }
.chcard .no { flex:none; width:52px; height:52px; border-radius:50%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; color:#fff; font-family:"KaiTi","楷体",serif; line-height:1.1; }
.chcard .no b { font-size:17px; } .chcard .no span { font-size:10px; opacity:.85; }
.chcard .info { flex:1; min-width:0; }
.chcard .info h3 { font-family:"KaiTi","楷体",serif; font-size:17px; letter-spacing:.5px; }
.chcard .info p { font-size:12px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chcard .bar { height:6px; background:var(--paper2); border-radius:4px; margin-top:7px; overflow:hidden; border:1px solid var(--line); }
.chcard .bar i { display:block; height:100%; border-radius:4px; }
.chcard .pct { font-size:11px; color:var(--ink2); margin-top:3px; }

.quick { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
@media (min-width:640px){ .quick{ grid-template-columns:repeat(4,180px); } }
.quick a { background:var(--card); border:1.5px solid var(--ink); border-radius:11px; text-align:center;
  padding:10px 4px 8px; text-decoration:none; color:var(--ink); font-size:12px; box-shadow:2px 2px 0 #00000012; }
.quick a i { display:block; font-style:normal; font-size:19px; font-family:"KaiTi","楷体",serif; color:var(--red); }
.quick a b { display:block; font-weight:600; margin-top:2px; }

/* ===== 章/节列表 ===== */
.sec-item { display:flex; gap:12px; align-items:flex-start; background:var(--card);
  border:1.5px solid var(--ink); border-radius:var(--radius); padding:13px 14px; margin-bottom:10px;
  box-shadow:2px 2px 0 #00000012; }
.sec-item .idx { flex:none; width:34px; height:34px; border-radius:9px; color:#fff; display:flex;
  align-items:center; justify-content:center; font-family:"KaiTi","楷体",serif; font-size:15px; margin-top:2px; }
.sec-item .bd { flex:1; min-width:0; }
.sec-item h3 { font-family:"KaiTi","楷体",serif; font-size:16.5px; }
.sec-item .lead { font-size:12.5px; color:var(--ink2); margin-top:2px; }
.sec-item .meta { font-size:11.5px; color:var(--ink2); margin-top:5px; display:flex; gap:10px; flex-wrap:wrap; }
.sec-item .meta b.ok { color:#3a7d44; }
.ch-head { margin:4px 0 14px; }
.ch-head .tag { display:inline-block; background:var(--ink); color:var(--paper); font-size:11px;
  padding:2px 10px; border-radius:99px; letter-spacing:2px; }
.ch-head h2 { font-family:"KaiTi","楷体",serif; font-size:24px; margin-top:6px; letter-spacing:1px; }
.ch-head p { color:var(--ink2); font-size:13.5px; margin-top:4px; }

/* ===== 知识点卡 ===== */
.pcard { background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius);
  padding:15px 15px 13px; margin-bottom:14px; box-shadow:3px 3px 0 #00000015; position:relative; }
.pcard .key-star { position:absolute; top:-9px; right:10px; background:var(--gold); color:#fff;
  font-size:11px; padding:1px 10px; border-radius:99px; letter-spacing:1px; box-shadow:1px 1px 0 #00000030; }
.pcard h3 { font-family:"KaiTi","楷体",serif; font-size:18px; letter-spacing:.5px; margin-bottom:8px; }
.pcard h3::before { content:""; display:inline-block; width:8px; height:8px; background:currentColor; border-radius:2px; transform:rotate(45deg); margin-right:9px; opacity:.55; }
.pcard p { margin:7px 0; font-size:15.5px; }
.pcard p b { color:var(--red); }
.pcard ul { margin:6px 0 6px 4px; list-style:none; }
.pcard ul li { padding-left:20px; position:relative; margin:5px 0; font-size:15px; }
.pcard ul li::before { content:"·"; position:absolute; left:6px; color:var(--red); font-weight:900; }
.pcard ul li b { color:var(--red); }
table.kv { width:100%; border-collapse:collapse; margin:9px 0; font-size:13.8px; border:1.5px solid var(--ink); border-radius:8px; overflow:hidden; }
table.kv th { background:var(--paper2); font-weight:600; font-size:12.8px; }
table.kv th, table.kv td { border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top; line-height:1.6; }
.box { border-radius:10px; padding:10px 12px; margin:10px 0 4px; font-size:14px; position:relative; }
.box .bt { font-family:"KaiTi","楷体",serif; font-weight:700; font-size:13px; letter-spacing:1px; display:block; margin-bottom:3px; }
.box.tip { background:#fbeee9; border:1px dashed #c9836f; color:#6d3a2c; }
.box.tip .bt { color:#b5432f; }
.box.memo { background:#eef3e4; border:1px dashed #8aa86a; color:#44562f; }
.box.memo .bt { color:#5c7a34; }
.box.fuding { background:#fdf6e8; border:1.5px solid var(--gold); color:#5c4a1e; }
.box.fuding .bt { color:var(--gold); }
.box.fuding::before { content:"印"; position:absolute; top:-9px; right:12px; width:22px; height:22px;
  background:var(--red); color:#fff; border-radius:5px; font-size:12px; display:flex; align-items:center; justify-content:center;
  font-family:"KaiTi","楷体",serif; transform:rotate(8deg); box-shadow:1px 1px 0 #00000030; }
.box.ext { background:#e8f0f4; border:1px dashed #6a93ad; color:#33505f; }
.box.ext .bt { color:#41679c; }

/* 图解 */
.dgm { border:1.5px solid var(--ink); border-radius:12px; margin:10px 0 4px; background:#fbf8ef; overflow:hidden; }
.dgm .cap { font-size:12.5px; color:var(--ink2); text-align:center; padding:6px 10px; border-top:1px dashed var(--line); }
.dgm svg { display:block; width:100%; height:auto; }
.dgm .dgm-btns { display:flex; gap:8px; justify-content:center; padding:0 10px 9px; flex-wrap:wrap; }
.dgm .dgm-btns button { font:13px/1.4 inherit; background:var(--card); border:1.5px solid var(--ink); border-radius:99px; padding:4px 14px; cursor:pointer; color:var(--ink); }
.dgm .dgm-btns button.on { background:var(--ink); color:var(--paper); }
svg .lg { font-family:"KaiTi","楷体",serif; }
svg .tap { cursor:pointer; }

/* ===== 答题 ===== */
.btn { display:inline-block; background:var(--ink); color:var(--paper); border:none; border-radius:11px;
  padding:11px 26px; font-size:15.5px; font-family:"KaiTi","楷体",serif; letter-spacing:2px; cursor:pointer;
  box-shadow:2px 2px 0 #00000025; text-decoration:none; text-align:center; }
.btn.red { background:var(--red); }
.btn.ghost { background:var(--card); color:var(--ink); border:1.5px solid var(--ink); box-shadow:none; }
.btn.block { display:block; width:100%; }
.btn:disabled { opacity:.45; }
.center { text-align:center; }

.quizcard { background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius); padding:16px; box-shadow:3px 3px 0 #00000015; }
.qno { font-size:12px; color:var(--ink2); letter-spacing:1px; }
.qno b { color:var(--red); font-size:15px; }
.qstem { font-size:16px; margin:8px 0 12px; line-height:1.8; white-space:pre-wrap; }
.qnote { font-size:13px; color:var(--ink2); background:var(--paper2); border-radius:9px; padding:8px 11px; margin:8px 0; line-height:1.7; }
.opt { display:flex; gap:10px; align-items:flex-start; border:1.5px solid var(--line); border-radius:11px;
  padding:11px 12px; margin:9px 0; cursor:pointer; font-size:15px; line-height:1.65; background:var(--card); }
.opt .abc { flex:none; width:26px; height:26px; border-radius:50%; border:1.5px solid var(--ink);
  display:flex; align-items:center; justify-content:center; font-family:"KaiTi","楷体",serif; font-size:14px; margin-top:1px; }
.opt.sel { border-color:var(--ink); background:var(--paper2); }
.opt.right { border-color:#3a7d44; background:#edf4e8; }
.opt.right .abc { background:#3a7d44; border-color:#3a7d44; color:#fff; }
.opt.wrong { border-color:var(--red); background:#fbe9e4; }
.opt.wrong .abc { background:var(--red); border-color:var(--red); color:#fff; }
.opt.dim { opacity:.55; }
.exp { border-left:4px solid var(--gold); background:#fdf6e8; padding:10px 12px; border-radius:0 10px 10px 0;
  font-size:14px; margin:12px 0; color:#4c3d17; line-height:1.8; }
.exp b { color:var(--red); }
.qnav { display:flex; gap:10px; margin-top:14px; }
.qnav .btn { flex:1; }

/* 试卷页 */
.examcard { background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:2px 2px 0 #00000012; position:relative; }
.examcard .kind { position:absolute; top:-10px; left:12px; font-size:11px; color:#fff; padding:2px 12px; border-radius:99px; letter-spacing:2px; }
.examcard h3 { font-family:"KaiTi","楷体",serif; font-size:16.5px; margin:4px 0 3px; }
.examcard .meta { font-size:12px; color:var(--ink2); }
.examcard .best { font-size:12.5px; color:#3a7d44; margin-top:6px; }
.examcard .btn { margin-top:10px; }
.note-tag { display:inline-block; background:var(--paper2); border:1px solid var(--line); font-size:11px; color:var(--ink2); border-radius:99px; padding:0 8px; margin-left:6px; }

/* 综合题 */
.essay { border:1.5px dashed var(--ink); border-radius:12px; padding:13px; margin:12px 0; background:#fbf8ef; }
.essay .en { font-family:"KaiTi","楷体",serif; font-weight:700; }
.essay .estem { font-size:14.5px; margin:6px 0; line-height:1.8; white-space:pre-wrap; }
.essay .eqs { font-size:14.5px; margin:6px 0; padding-left:2px; line-height:1.8; white-space:pre-wrap; }
.essay .ans { display:none; background:#eef3e4; border-radius:9px; padding:10px 12px; margin-top:9px; font-size:13.8px; line-height:1.9; color:#37451f; }
.essay .ans li { margin:3px 0 3px 18px; }
.essay .selfmark { display:flex; gap:10px; margin-top:10px; }
.essay .selfmark .btn { flex:1; padding:8px 0; font-size:14px; }
.essay.marked .selfmark .btn { opacity:.5; }

/* 错题/成就 */
.empty { text-align:center; color:var(--ink2); padding:46px 20px; }
.empty i { display:block; font-style:normal; font-size:38px; font-family:"KaiTi","楷体",serif; color:var(--line); }
.badge-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media (min-width:640px){ .badge-grid{grid-template-columns:repeat(3,1fr);} }
.badge { background:var(--card); border:1.5px solid var(--ink); border-radius:13px; padding:13px 10px; text-align:center; box-shadow:2px 2px 0 #00000012; }
.badge .ic { width:52px; height:52px; margin:0 auto 7px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-family:"KaiTi","楷体",serif; font-size:23px; background:var(--paper2); color:var(--ink2); }
.badge.got .ic { background:var(--red); color:#fff; box-shadow:inset 0 0 0 3px #ffffff55; }
.badge h4 { font-family:"KaiTi","楷体",serif; font-size:15px; }
.badge p { font-size:11.5px; color:var(--ink2); line-height:1.5; }
.badge.got h4 { color:var(--red); }
.badge:not(.got) { opacity:.62; }

/* ===== 底部 tabbar ===== */
#tabbar { position:fixed; bottom:0; left:0; right:0; z-index:40; display:flex;
  background:#fffdf6f2; backdrop-filter:blur(6px); border-top:1.5px solid var(--ink);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom)); max-width:100%; }
#tabbar a { flex:1; text-align:center; text-decoration:none; color:var(--ink2); font-size:11px; padding:3px 0; position:relative; }
#tabbar a .tb-ico { display:block; font-style:normal; font-size:19px; line-height:1.25; font-family:"KaiTi","楷体",serif; }
#tabbar a.on { color:var(--red); }
#tabbar a .dot { position:absolute; top:0; right:18%; width:9px; height:9px; background:var(--red); border-radius:50%; border:1.5px solid #fff; }

/* 结果页 */
.result { text-align:center; padding:26px 12px 18px; }
.result .big { font-family:"KaiTi","楷体",serif; font-size:52px; color:var(--red); line-height:1.1; }
.result .sub { color:var(--ink2); font-size:13.5px; margin-top:4px; }
.result .msg { font-size:15px; margin:14px auto 4px; max-width:420px; line-height:1.9; }
.progress-ring { transform:rotate(-90deg); }
.hr-dash { border:none; border-top:1px dashed var(--line); margin:16px 0; }
.mut { color:var(--ink2); font-size:12.5px; }
.foot { text-align:center; color:var(--ink2); font-size:11.5px; padding:26px 0 14px; letter-spacing:1px; }
.new-badge-toast { position:fixed; z-index:60; left:50%; bottom:88px; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); border-radius:99px; padding:9px 20px; font-size:13.5px;
  font-family:"KaiTi","楷体",serif; letter-spacing:1px; box-shadow:0 4px 14px #00000040; animation:toastIn .3s; }
@keyframes toastIn { from { opacity:0; transform:translate(-50%,14px); } }

</style>
<style>
/* 化学方程式渲染 */
.eqline { padding:7px 12px; margin:9px 0; background:var(--paper2); border-left:3px solid var(--gold);
  border-radius:0 9px 9px 0; font-size:15.5px; line-height:2; letter-spacing:.3px; }
.eqline .cond-note { font-size:12px; color:var(--ink2); }
.rxn { position:relative; display:inline-block; min-width:2.6em; text-align:center; padding:0 2px; }
.rxn i { position:absolute; left:50%; top:-0.95em; transform:translateX(-50%); font-style:normal;
  font-size:10.5px; color:var(--ink2); white-space:nowrap; letter-spacing:1px; }
</style>
</head>
<body>
<div id="app">
  <div class="boot-note">正在翻开化学书……</div>
</div>
<nav id="tabbar">
  <a href="#/" data-tab="home"><i class="tb-ico">◎</i><span>首页</span></a>
  <a href="#/chapters" data-tab="chapters"><i class="tb-ico">☰</i><span>知识点</span></a>
  <a href="#/exams" data-tab="exams"><i class="tb-ico">▣</i><span>刷卷</span></a>
  <a href="#/wrong" data-tab="wrong"><i class="tb-ico">✗</i><span>错题本<span id="wrong-dot" class="dot" hidden></span></span></a>
  <a href="#/badges" data-tab="badges"><i class="tb-ico">✦</i><span>成就</span></a>
</nav>
<script>
/* 化学图解库 · 手绘风 SVG 交互
   每个图解注册为 DB.diagrams[id] = { title, w, h, build(el) } */
(function () {
  var DB = window.DB = window.DB || {};
  var D = DB.diagrams = {};
  var INK = '#3a332b';

  function base(el, svg, btns, cap) {
    var h = '<div class="dgm-wrap">' + svg + '</div>';
    if (btns && btns.length) {
      h += '<div class="dgm-btns">' + btns.map(function (b) {
        return '<button data-act="' + b.act + '"' + (b.on ? ' class="on"' : '') + '>' + b.t + '</button>';
      }).join('') + '</div>';
    }
    h += '<div class="cap">' + cap + '</div>';
    el.innerHTML = h;
    el.$ = function (s) { return el.querySelector(s); };
    el.$ = function (s) { return Array.prototype.slice.call(el.querySelectorAll(s)); };
  }
  function setCap(el, t) { var c = el.querySelector('.cap'); if (c) c.innerHTML = t; }
  function markBtn(el, act) {
    el.$('.dgm-btns button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-act') === act); });
  }
  function box(x, y, w, hgt, txt, fill, fs) {
    return '<g><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + hgt + '" rx="9" fill="' + (fill || '#fbf6e8') + '" stroke="' + INK + '" stroke-width="1.6"/>' +
      '<text x="' + (x + w / 2) + '" y="' + (y + hgt / 2 + 5.5) + '" text-anchor="middle" class="lg" font-size="' + (fs || 15) + '">' + txt + '</text></g>';
  }
  function arrow(x1, y1, x2, y2, col, id, label, labDx, labDy) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="3" marker-end="url(#' + id + ')" class="tap" data-cap="' + (label || '') + '">' +
      (label ? '' : '') + '</line>';
  }
  function defsMk(id, col) {
    return '<defs><marker id="' + id + '" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="' + (col || INK) + '"/></marker></defs>';
  }

  /* ========== 1. 物质的量"桥梁" ========== */
  D['mole-bridge'] = { title: '物质的量 n：连接微观与宏观的桥梁', w: 720, h: 380, build: function (el) {
    var s = defsMk('mb1') + defsMk('mb1r', '#b5432f');
    s += '<circle cx="360" cy="190" r="58" fill="#e2a93b" stroke="' + INK + '" stroke-width="2"/>' +
      '<text x="360" y="182" text-anchor="middle" class="lg" font-size="22" font-weight="700">n</text>' +
      '<text x="360" y="208" text-anchor="middle" class="lg" font-size="13">物质的量(mol)</text>';
    var node = function (x, y, t1, t2) {
      return '<g class="tap" data-cap="' + t1 + '"><rect x="' + (x - 82) + '" y="' + (y - 34) + '" width="164" height="68" rx="11" fill="#fbf6e8" stroke="' + INK + '" stroke-width="1.6"/>' +

        '（3）Cu + 2H₂SO₄(浓) =Δ= CuSO₄ + SO₂↑ + 2H₂O；强氧化性（部分硫酸被还原）与酸性（生成硫酸盐）',
        '（4）燃煤脱硫（钙基固硫）、尾气碱液吸收、开发清洁能源等（合理即可）'
      ]},
      { no: 28, score: 12, stem: '氮的循环与人类活动。阅读材料回答问题。\n材料一：雷雨天，空气中的 N₂ 和 O₂ 在放电条件下化合，随雨水降落成为土壤中的氮肥（"雷雨发庄稼"）。\n材料二：汽车尾气中含有 NOx，是形成光化学烟雾和雾霾的重要前体物，宁德市对高排放车辆实施限行政策（对应教材微项目"论证重污染天气汽车限行的合理性"）。', qs: [
        '（1）写出放电条件下 N₂ 与 O₂ 反应的化学方程式：＿＿＿＿。',

        '（5）N₂ + 3H₂ ⇌(高温高压、催化剂) 2NH₃；同一条件下，正反应与逆反应同时进行，反应物不能完全转化为生成物'

<script>
/* 福鼎少年学化学 · 应用逻辑 */
(function () {
  var DB = window.DB;
  var $app = document.getElementById('app');
  var LS = 'geo1v1';
  var P = { done: {}, q: {}, days: {}, fuding: {}, exam: {}, wrongCleared: 0, seen: 0 };
  try { var raw = localStorage.getItem(LS); if (raw) { var o = JSON.parse(raw); for (var k in P) if (o[k] !== undefined) P[k] = o[k]; } } catch (e) { }

  function save() { try { localStorage.setItem(LS, JSON.stringify(P)); } catch (e) { } }
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  P.days[today()] = 1;

  /* ---------- 索引 ---------- */
  var SEC = {}, CH = {};
  DB.chapters.forEach(function (c) {
    CH[c.id] = c;
    c.sections.forEach(function (s) { SEC[s.id] = s; s.ch = c.id; });
  });
  var Q = {};
  DB.questions.forEach(function (q) { Q[q.id] = q; });
  /* 试卷题索引（错题本用）：ex_<卷id>_<题号> → 题目 */
  var EXQ = {};
  DB.exams.forEach(function (ex) {
    var no = 0;
    ex.mcq.forEach(function (g) { g.qs.forEach(function (q) { no++; q._from = ex.title; EXQ['ex_' + ex.id + '_' + no] = q; }); });
  });
  var allSections = [];
  DB.chapters.forEach(function (c) { c.sections.forEach(function (s) { allSections.push(s.id); }); });

  /* ---------- 成就 ---------- */
  var BADGES = [
    { id: 'b1', ic: '启', t: '启程', d: '学完第一个知识点', chk: function () { return Object.keys(P.done).length >= 1; } },
    { id: 'b2', ic: '科', t: '走进化学科学', d: '第一章全部学完', chk: function () { return chDone('ch1'); } },
    { id: 'b3', ic: '素', t: '元素与物质世界', d: '第二章全部学完', chk: function () { return chDone('ch2'); } },
    { id: 'b4', ic: '转', t: '性质与转化', d: '第三章全部学完', chk: function () { return chDone('ch3'); } },
    { id: 'b5', ic: '十', t: '初试锋芒', d: '随堂练累计答对10题', chk: function () { return totalRight() >= 10; } },
    { id: 'b6', ic: '百', t: '百炼成钢', d: '随堂练累计答对50题', chk: function () { return totalRight() >= 50; } },
    { id: 'b7', ic: '卷', t: '卷面首胜', d: '完成一整套试卷', chk: function () { return Object.keys(P.exam).length >= 1; } },
    { id: 'b8', ic: '猎', t: '错题猎人', d: '把错题本清空一次', chk: function () { return !!P.wrongCleared; } },
    { id: 'b9', ic: '鼎', t: '福鼎化学通', d: '点开全部福鼎限定卡', chk: function () { return fudingTotal() > 0 && Object.keys(P.fuding).length >= fudingTotal(); } },
    { id: 'b10', ic: '七', t: '七日之约', d: '累计学习7天', chk: function () { return Object.keys(P.days).length >= 7; } }
  ];
  function chDone(cid) { var c = CH[cid]; return c && c.sections.every(function (s) { return P.done[s.id]; }); }
  function totalRight() { var n = 0; for (var k in P.q) n += P.q[k].r || 0; return n; }
  function fudingTotal() {
    var n = 0;
    DB.chapters.forEach(function (c) { c.sections.forEach(function (s) { s.points.forEach(function (p) { p.blocks.forEach(function (b) { if (b[0] === 'fuding') n++; }); }); }); });
    return n;
  }
  function wrongIds() { var r = []; for (var k in P.q) if (P.q[k].last === 'w') r.push(k); return r; }
  function checkBadges() {
    var got = [];
    BADGES.forEach(function (b) { if (!P['bg_' + b.id] && b.chk()) { P['bg_' + b.id] = 1; got.push(b); } });
    save();
    got.forEach(function (b, i) { setTimeout(function () { toast('🎉 获得成就「' + b.t + '」'); }, i * 500); });
  }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'new-badge-toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
  }

  /* ---------- 工具 ---------- */
  function h(html) { $app.innerHTML = html; window.scrollTo(0, 0); syncTab(); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function topbar(title, sub, back) {
    return '<div class="topbar">' + (back ? '<a class="back" href="' + back + '">‹</a>' : '') +
      '<div class="seal kai">化</div><h1 class="kai">' + title + '<small>' + (sub || '') + '</small></h1></div>';
  }
  function syncTab() {
    var cur = location.hash || '#/';
    var qi = cur.indexOf('?'); if (qi >= 0) cur = cur.slice(0, qi);
    var seg = (cur.replace(/^#\/?/, '').split('/')[0] || 'home');
    var map = { home: '#/', chapters: '#/chapters', ch: '#/chapters', sec: '#/chapters', exams: '#/exams', exam: '#/exams', wrong: '#/wrong', badges: '#/badges' };
    var href = map[seg] || '#/';
    document.querySelectorAll('#tabbar a').forEach(function (a) {
      a.classList.toggle('on', a.getAttribute('href') === href);
    });
    var w = wrongIds().length;
    var dot = document.getElementById('wrong-dot'); if (dot) dot.hidden = w === 0;
  }
  window.addEventListener('hashchange', route);

  /* ---------- 首页 ---------- */
  function ring(pct, col) {
    var r = 30, c = 2 * Math.PI * r;
    return '<svg class="progress-ring" width="76" height="76" viewBox="0 0 76 76">' +
      '<circle cx="38" cy="38" r="' + r + '" fill="none" stroke="#e6dcc4" stroke-width="9"/>' +
      '<circle cx="38" cy="38" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (c * pct / 100).toFixed(1) + ' ' + c.toFixed(1) + '"/>' +
      '<text x="38" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="#322c26" transform="rotate(90 38 38)">' + pct + '%</text></svg>';
  }
  function vHome() {
    var learned = allSections.filter(function (s) { return P.done[s]; }).length;
    var pct = Math.round(learned / allSections.length * 100);
    var att = 0, right = 0; for (var k in P.q) { att += P.q[k].n; right += P.q[k].r; }
    var acc = att ? Math.round(right / att * 100) : null;
    var w = wrongIds().length;
    var next = allSections.filter(function (s) { return !P.done[s]; })[0];
    var nextSec = SEC[next];
    var nextCh = nextSec ? CH[nextSec.ch] : null;
    var html = topbar('福鼎少年学化学', '鲁科版 高中化学 必修一二 · 上学期考点＋下学期预习');
    html += '<div class="hero"><div class="h-row"><div class="ring">' + ring(pct, 'var(--red)') + '</div><div style="flex:1;min-width:0">' +
      '<h2>学习进度</h2><p class="sub">已学 ' + learned + ' / ' + allSections.length + ' 节 · 随堂练答对 ' + right + ' 题</p>' +
      '<div class="stats"><span class="st">正确率 <b>' + (acc === null ? '—' : acc + '%') + '</b></span>' +
      '<span class="st">错题 <b>' + w + '</b></span><span class="st">成就 <b>' + Object.keys(P).filter(function (k) { return k.indexOf('bg_') === 0; }).length + '/' + BADGES.length + '</b></span></div>' +
      (nextSec ? '<div class="tip">下一节：<b>' + nextCh.no + ' ' + nextSec.title + '</b>　<a href="#/sec/' + nextSec.id + '" style="color:var(--red)">去学 →</a></div>' : '<div class="tip">六章全部学完，了不起！去刷卷巩固吧。</div>') +
      '</div></div></div>';
    html += '<div class="quick">' +
      '<a href="' + (nextSec ? '#/sec/' + nextSec.id : '#/chapters') + '"><i>读</i><b>继续学习</b></a>' +
      '<a href="#/exams"><i>卷</i><b>刷卷</b></a>' +
      '<a href="#/wrong"><i>错</i><b>错题本</b></a>' +
      '<a href="#/badges"><i>奖</i><b>成就</b></a></div>';
    html += '<div class="sec-title">六章知识点 <small>第4~6章＝必修第二册·下学期预习</small></div><div class="ch-grid">';
    DB.chapters.forEach(function (c) {
      var d = c.sections.filter(function (s) { return P.done[s.id]; }).length;
      var p = Math.round(d / c.sections.length * 100);
      html += '<a class="chcard" href="#/ch/' + c.id + '"><div class="no" style="background:' + c.color + '"><b>' + c.no.replace('第', '').replace('章', '') + '</b><span>章</span></div>' +
        '<div class="info"><h3>' + (c.phase === '二' ? '<span class="note-tag">下学期预习</span> ' : '') + c.title + '</h3><p>' + c.tagline + '</p>' +
        '<div class="bar"><i style="width:' + p + '%;background:' + c.color + '"></i></div><div class="pct">' + p + '%</div></div></a>';
    });
    html += '</div>';
    html += '<div class="foot">为福鼎的化学少年而作 · 学好化学，守护生活</div>';
    h(html);
  }

  /* ---------- 章列表 / 章页 ---------- */
  function vChapters() {
    var html = topbar('知识点', '六章 · ' + allSections.length + '节', '#/');
    DB.chapters.forEach(function (c) {
      html += '<div class="sec-title" style="color:' + c.color + '">' + c.no + ' ' + c.title + (c.phase === '二' ? '（下学期预习）' : '') + '</div>';
      c.sections.forEach(function (s) {
        var qn = s.quiz.length, qr = 0;
        s.quiz.forEach(function (qid) { if (P.q[qid] && P.q[qid].last === 'r') qr++; });
        html += '<a class="sec-item" href="#/sec/' + s.id + '" style="text-decoration:none">' +
          '<div class="idx" style="background:' + c.color + '">' + s.no.replace('第一节', '一').replace('第二节', '二').replace('第三节', '三').replace('第四节', '四') + '</div>' +
          '<div class="bd"><h3>' + s.title + '</h3><div class="lead">' + s.lead + '</div>' +
          '<div class="meta"><span>' + s.points.length + '个知识点</span><span>练习 ' + s.quiz.length + '题</span>' +
          (P.done[s.id] ? '<b class="ok">✓ 已学</b>' : '') + (qn && qr === qn ? '<b class="ok">✓ 练习全对</b>' : '') + '</div></div></a>';
      });
    });
    html += '<div class="foot">跟着教材走，一章别落下</div>';
    h(html);
  }
  function vChapter(cid) {
    var c = CH[cid]; if (!c) return vHome();
    var html = topbar(c.no + ' · ' + c.title, c.tagline, '#/chapters');
    html += '<div class="ch-head"><span class="tag">' + c.no + '</span><h2 class="kai">' + c.title + '</h2><p>' + c.intro + '</p></div>';
    c.sections.forEach(function (s) {
      html += '<a class="sec-item" href="#/sec/' + s.id + '" style="text-decoration:none">' +
        '<div class="idx" style="background:' + c.color + '">' + s.no.replace('第一节', '一').replace('第二节', '二').replace('第三节', '三').replace('第四节', '四') + '</div>' +
        '<div class="bd"><h3>' + s.title + '</h3><div class="lead">' + s.lead + '</div>' +
        '<div class="meta"><span>' + s.points.length + '个知识点</span><span>' + s.quiz.length + '道随堂练</span>' + (P.done[s.id] ? '<b class="ok">✓ 已学</b>' : '') + '</div></div></a>';
    });
    html += '<div class="foot">' + c.tagline + '</div>';
    h(html);
  }

  /* ---------- 节页（知识点卡） ---------- */
  function renderBlocks(p, el) {
    var html = '';
    p.blocks.forEach(function (b) {
      var t = b[0];
      if (t === 'p') html += '<p>' + b[1] + '</p>';
      else if (t === 'ul') html += '<ul>' + b[1].map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
      else if (t === 'kv') html += '<table class="kv">' + b[1].map(function (r) { return '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>'; }).join('') + '</table>';
      else if (t === 'table') html += '<table class="kv"><tr>' + b[1].head.map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr>' +
        b[1].rows.map(function (r) { return '<tr>' + r.map(function (x) { return '<td>' + x + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>';
      else if (t === 'tip') html += '<div class="box tip"><span class="bt">老班长敲黑板 · 易错</span>' + b[1] + '</div>';
      else if (t === 'memo') html += '<div class="box memo"><span class="bt">记忆口诀</span>' + b[1] + '</div>';
      else if (t === 'ext') html += '<div class="box ext"><span class="bt">拓展视野 · 加分项</span>' + b[1] + '</div>';
      else if (t === 'note') html += '<div class="box" style="background:var(--paper2)">' + b[1] + '</div>';
      else if (t === 'eq') html += '<div class="eqline">' + b[2] + ' ' + (b[1] === '=' ? ' = ' : (b[1] === '⇌' ? ' ⇌ ' : '<span class="rxn">' + (b[1] && b[1] !== '可逆' ? '<i>' + b[1] + '</i>' : '') + (b[1] === '可逆' ? '⇌' : '→') + '</span>')) + ' ' + b[3] + '</div>';
      else if (t === 'fuding') {
        var key = p.id + '#' + b[1][0];
        var open = !!P.fuding[key];
        html += '<div class="box fuding" data-fuding="' + esc(key) + '" style="cursor:pointer">' +
          '<span class="bt">福鼎限定 · ' + b[1][0] + (open ? '' : '（点开看看）') + '</span>' +
          '<div class="fd-bd" style="' + (open ? '' : 'display:none') + '">' + b[1][1] + '</div></div>';
      }
      else if (t === 'dgm') html += '<div class="dgm" id="dgm-' + b[1] + '"></div><div style="font-size:12.5px;color:var(--ink2);text-align:center;margin:-4px 0 10px">' + (b[2] || '') + '</div>';
    });
    el.innerHTML = html;
    Array.prototype.slice.call(el.querySelectorAll('[data-fuding]')).forEach(function (n) {
      n.onclick = function () {
        var bd = n.querySelector('.fd-bd');
        var opening = bd.style.display === 'none';
        bd.style.display = opening ? '' : 'none';
        var key = n.getAttribute('data-fuding');
        if (opening) { P.fuding[key] = 1; save(); checkBadges(); }
      };
    });
    Array.prototype.slice.call(el.querySelectorAll('.dgm')).forEach(function (d) {
      var id = d.id.replace('dgm-', '');
      var dg = DB.diagrams[id];
      if (dg) d.appendChild(buildDgm(id));
    });
  }
  function buildDgm(id) {
    var dg = DB.diagrams[id];
    var box = document.createElement('div');
    box.innerHTML = '<div style="padding:8px 8px 0;text-align:center;font-family:KaiTi,楷体,serif;font-size:13.5px;color:var(--ink2)">▸ ' + dg.title + '</div>';
    var inner = document.createElement('div');
    box.appendChild(inner);
    try { dg.build(inner); } catch (e) { inner.innerHTML = '<div class="cap">图解加载失败：' + esc(e.message) + '</div>'; }
    return box;
  }
  function vSection(sid) {
    var s = SEC[sid]; if (!s) return vHome();
    var c = CH[s.ch];
    var html = topbar(s.no + ' · ' + s.title, c.no + ' · ' + c.title, '#/ch/' + c.id);
    html += '<div class="ch-head"><span class="tag" style="background:' + c.color + '">' + c.no + ' · ' + s.no + '</span><h2 class="kai">' + s.title + '</h2><p>' + s.lead + '</p></div>';
    s.points.forEach(function (p) {
      html += '<div class="pcard">' + (p.key ? '<span class="key-star">高频考点</span>' : '') + '<h3>' + p.title + '</h3><div class="pb"></div></div>';
    });
    html += '<div class="center" style="margin:18px 0 8px">' +
      '<button class="btn red" id="markdone" style="' + (P.done[s.id] ? 'display:none' : '') + '">这节我学完了 ✓</button>' +
      (P.done[s.id] ? '<div class="mut">✓ 已标记学完</div>' : '') + '</div>';
    html += '<div id="quiz-area"></div><div class="foot">' + c.title + ' · ' + s.title + '</div>';
    h(html);
    var cards = $app.querySelectorAll('.pcard');
    s.points.forEach(function (p, i) {
      var pb = cards[i].querySelector('.pb');
      renderBlocks(p, pb);
    });
    var md = document.getElementById('markdone');
    if (md) md.onclick = function () { P.done[s.id] = 1; save(); checkBadges(); vSection(sid); };
    mountQuiz(s);
  }

  /* ---------- 随堂练 ---------- */
  function mountQuiz(s) {
    var area = document.getElementById('quiz-area');
    var allRight = s.quiz.every(function (q) { return P.q[q] && P.q[q].last === 'r'; });
    var html = '<div class="sec-title">随堂练 <small>' + s.quiz.length + '题 · 答完自动记入错题本</small></div>' +
      '<div class="quizcard center" style="padding:22px 16px">' +
      '<div class="kai" style="font-size:19px;margin-bottom:6px">' + s.title + ' · 小测验</div>' +
      '<p class="mut">' + (allRight ? '✓ 你已全部答对，可以再刷一遍巩固。' : '每题答完立即看解析，答错的自动进错题本。') + '</p>' +
      '<button class="btn red" id="qstart">开始练习</button></div>';
    area.innerHTML = html;
    document.getElementById('qstart').onclick = function () { runQuiz(s); };
  }
  function runQuiz(s) {
    var area = document.getElementById('quiz-area');
    var ids = s.quiz.slice(), i = 0, firstRight = 0;
    function record(qid, ok) {
      var r = P.q[qid] = P.q[qid] || { n: 0, r: 0, last: null };
      r.n++; if (ok) { r.r++; r.last = 'r'; } else { r.last = 'w'; }
      save();
    }
    function draw() {
      if (i >= ids.length) {
        var rate = Math.round(firstRight / ids.length * 100);
        var msg = rate === 100 ? '全对！这节稳了。' : rate >= 80 ? '不错！错的那几题去错题本里再过一遍。' : rate >= 60 ? '有基础，把解析读一遍再回来重做。' : '别灰心，回到上面的知识点卡里再读一遍，马上再来。';
        area.innerHTML = '<div class="quizcard result">' +
          '<div class="big">' + firstRight + '<span style="font-size:22px">/' + ids.length + '</span></div>' +
          '<div class="sub">正确率 ' + rate + '%</div><div class="msg">' + msg + '</div>' +
          '<div style="display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap">' +
          '<button class="btn ghost" id="qretry">再练一遍</button><a class="btn" href="#/ch/' + s.ch + '">返回章节</a></div></div>';
        document.getElementById('qretry').onclick = function () { runQuiz(s); };
        checkBadges(); syncTab();
        return;
      }
      var q = Q[ids[i]];
      var html = '<div class="quizcard"><div class="qno">随堂练 · 第 <b>' + (i + 1) + '</b> / ' + ids.length + ' 题' +
        (q.tag ? '　<span class="note-tag">' + q.tag + '</span>' : '') + '</div>' +
        '<div class="qstem">' + q.stem + '</div><div class="opts">';
      q.opts.forEach(function (o, j) {
        html += '<div class="opt" data-j="' + j + '"><span class="abc">' + 'ABCD'[j] + '</span><span>' + o + '</span></div>';
      });
      html += '</div><div id="qexp"></div><div class="qnav">' +
        '<button class="btn" id="qnext" disabled>下一题 →</button></div></div>';
      area.innerHTML = html;
      var answered = false;
      area.querySelectorAll('.opt').forEach(function (n) {
        n.onclick = function () {
          if (answered) return; answered = true;
          var j = +n.getAttribute('data-j'), ok = j === q.ans;
          if (ok) firstRight++;
          record(q.id, ok);
          area.querySelectorAll('.opt').forEach(function (m) {
            var mj = +m.getAttribute('data-j');
            if (mj === q.ans) m.classList.add('right');
            else if (mj === j) m.classList.add('wrong');
            else m.classList.add('dim');
          });
          document.getElementById('qexp').innerHTML = '<div class="exp"><b>' + (ok ? '答对了！' : '答错了。') + '</b>' + q.exp + '</div>';
          var nb = document.getElementById('qnext'); nb.disabled = false;
          if (i === ids.length - 1) nb.textContent = '看成绩 →';
          nb.onclick = function () { i++; draw(); };
          checkBadges(); syncTab();
        };
      });
    }
    draw();
  }

  /* ---------- 试卷 ---------- */
  function vExams() {
    var html = topbar('刷卷', '真题 + 宁德质检体例模拟卷', '#/');
    html += '<div class="ch-head"><span class="tag">考试中心</span><h2 class="kai">两套卷子</h2><p>按宁德市期末质检（福建学考）体例编写、结合福鼎生活情境的化学模拟卷。选择题自动批改并计入错题本，综合题（含化学方程式书写）对照参考答案自评。学考真题可向老师要当年卷，用本站章节知识点对照复习。</p></div>';
    DB.exams.forEach(function (ex) {
      var total = 0; ex.mcq.forEach(function (g) { total += g.qs.length; });
      var rec = P.exam[ex.id];
      html += '<div class="examcard"><span class="kind" style="background:' + ex.color + '">' + ex.kind + '</span>' +
        '<h3>' + ex.title + '</h3><div class="meta">' + ex.meta + '</div>' +
        (rec ? '<div class="best">上次成绩：选择题 ' + rec.best + ' / ' + total + ' 题（' + Math.round(rec.best / total * 100) + '分制参考：' + rec.best * 2 + '分）</div>' : '') +
        '<a class="btn red" href="#/exam/' + ex.id + '">开始作答</a></div>';
    });
    html += '<div class="foot">做卷子贵在"错题搞懂"，不在数量</div>';
    h(html);
  }
  function vExam(eid) {
    var ex = DB.exams.filter(function (x) { return x.id === eid; })[0]; if (!ex) return vExams();
    var flat = [];
    ex.mcq.forEach(function (g, gi) { g.qs.forEach(function (q, qi) { flat.push({ g: g, q: q, no: flat.length + 1, gStart: qi === 0 }); }); });
    var st = { i: 0, answers: {} };
    var total = flat.length;
    function draw() {
      var it = flat[st.i];
      var html = topbar(ex.kind + ' · 作答中', ex.title.replace(/·.*/, ''), '#/exams');
      html += '<div class="qno" style="margin:4px 2px 8px">选择题 第 <b>' + (st.i + 1) + '</b> / ' + total + ' 题</div>';
      if (it.gStart && it.g.note) html += '<div class="qnote">' + it.g.note + (it.g.badge ? '　<span class="note-tag">' + it.g.badge + '</span>' : '') + '</div>';
      html += '<div class="quizcard"><div class="qno"><b>' + it.no + '.</b></div><div class="qstem">' + it.q.stem + '</div><div class="opts">';
      it.q.opts.forEach(function (o, j) {
        html += '<div class="opt' + (st.answers[it.no] === j ? ' sel' : '') + '" data-j="' + j + '"><span class="abc">' + 'ABCD'[j] + '</span><span>' + o + '</span></div>';
      });
      html += '</div></div><div class="qnav">' +
        '<button class="btn ghost" id="eprev"' + (st.i === 0 ? ' disabled' : '') + '>← 上一题</button>' +
        '<button class="btn" id="enext">' + (st.i === total - 1 ? '交卷看成绩' : '下一题 →') + '</button></div>';
      html += '<div class="foot">已答 ' + Object.keys(st.answers).length + ' / ' + total + ' 题（可先跳过，最后再回来改）</div>';
      h(html);
      $app.querySelectorAll('.opt').forEach(function (n) {
        n.onclick = function () { st.answers[it.no] = +n.getAttribute('data-j'); draw(); };
      });
      document.getElementById('eprev').onclick = function () { if (st.i > 0) { st.i--; draw(); } };
      document.getElementById('enext').onclick = function () {
        if (st.i < total - 1) { st.i++; draw(); } else { finish(); }
      };
    }
    function finish() {
      var correct = 0, wrongList = [];
      flat.forEach(function (it) {
        var a = st.answers[it.no];
        if (a === it.q.ans) correct++;
        else { wrongList.push(it); if (a !== undefined) { var r = P.q['ex_' + ex.id + '_' + it.no] = P.q['ex_' + ex.id + '_' + it.no] || { n: 0, r: 0, last: null }; r.n++; r.last = 'w'; } }
      });
      save();
      P.exam[ex.id] = P.exam[ex.id] || { best: 0 };
      if (correct > P.exam[ex.id].best) P.exam[ex.id].best = correct;
      save();
      var html = topbar('成绩单', ex.title, '#/exams');
      html += '<div class="quizcard result"><div class="big">' + correct + '<span style="font-size:22px">/' + total + '</span></div>' +
        '<div class="sub">选择题正确率 ' + Math.round(correct / total * 100) + '%（满分卷面换算：' + correct * 2 + ' / ' + total * 2 + ' 分）</div>' +
        '<div class="msg">' + (correct / total >= 0.9 ? '这份卷子拿下了，期末就这个状态！' : correct / total >= 0.75 ? '稳中有升，错题看解析后重做一遍。' : correct / total >= 0.6 ? '及格线上，把错题对应的知识点回炉一遍再战。' : '别慌，先把对应章节的知识点卡过一遍，再来刷。') + '</div>' +
        '<div style="margin-top:12px"><a class="btn" href="#/wrong">错题都收进错题本了 →</a></div></div>';
      if (wrongList.length) {
        html += '<div class="sec-title">本次错题 <small>' + wrongList.length + '题 · 点开看解析</small></div>';
        wrongList.forEach(function (it) {
          html += '<div class="examcard"><h3>' + it.no + '. ' + it.q.stem.replace(/\n/g, '<br>') + '</h3>' +
            '<div class="meta">你的答案：' + (st.answers[it.no] !== undefined ? 'ABCD'[st.answers[it.no]] : '未作答') + ' · 正确答案：<b style="color:var(--red)">' + 'ABCD'[it.q.ans] + '</b></div>' +
            '<div class="exp">' + it.q.exp + '</div></div>';
        });
      }
      html += '<div class="sec-title">非选择题（综合题）<small>先自己写，再对照参考答案自评</small></div>';
      ex.essay.forEach(function (es) {
        html += '<div class="essay' + (P['es_' + ex.id + '_' + es.no] ? ' marked' : '') + '" id="essay-' + es.no + '">' +
          '<span class="en kai">' + es.no + '.（' + es.score + '分）</span>' +
          (es.badge ? ' <span class="note-tag">' + es.badge + '</span>' : '') +
          (es.dgm ? '<div class="dgm" id="dgm-' + es.dgm + '"></div>' : '') +
          '<div class="estem">' + es.stem + '</div>' +
          '<div class="eqs">' + es.qs.map(function (x) { return esc(x); }).join('<br>') + '</div>' +
          '<button class="btn ghost" style="margin-top:10px" data-ans="' + es.no + '">看参考答案</button>' +
          '<div class="ans"><b>参考答案（' + es.score + '分）</b><ol>' + es.ans.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol></div>' +
          '<div class="selfmark"><button class="btn" data-mk="1">✓ 基本掌握</button><button class="btn ghost" data-mk="0">✗ 还不会</button></div></div>';
      });
      html += '<div class="center" style="margin:16px 0"><a class="btn red" href="#/exams">返回卷子列表</a></div>';
      h(html);
      // 图解（真题重绘图）
      ex.essay.forEach(function (es) {
        if (es.dgm) {
          var d = document.getElementById('dgm-' + es.dgm);
          if (d) d.appendChild(buildDgm(es.dgm));
        }
      });
      $app.querySelectorAll('[data-ans]').forEach(function (b) {
        b.onclick = function () {
          var n = b.closest('.essay');
          n.querySelector('.ans').style.display = 'block'; b.style.display = 'none';
        };
      });
      $app.querySelectorAll('[data-mk]').forEach(function (b) {
        b.onclick = function () {
          var n = b.closest('.essay');
          n.classList.add('marked');
          P['es_' + ex.id + '_' + n.id.replace('essay-', '')] = b.getAttribute('data-mk') === '1';
          save();
          toast(b.getAttribute('data-mk') === '1' ? '记下了：这题掌握 ✓' : '已加入"还不会"，建议过两天再看一遍');
        };
      });
      checkBadges(); syncTab();
    }
    draw();
  }

  /* ---------- 错题本 ---------- */
  function vWrong() {
    var ids = wrongIds();
    var html = topbar('错题本', '答对重做即可移出', '#/');
    if (!ids.length) {
      html += '<div class="empty"><i>空</i>错题本是空的——<br>要么你很稳，要么你还没开始练。<br><a class="btn red" style="margin-top:14px" href="#/chapters">去做题</a></div>';
      h(html); return;
    }
    html += '<div class="ch-head"><span class="tag" style="background:var(--red)">错题</span><h2 class="kai">' + ids.length + ' 道题等你收拾</h2><p>点开题目重做，答对即自动移出错题本。</p></div>';
    ids.forEach(function (qid, idx) {
      var q = Q[qid] || EXQ[qid]; if (!q) return;
      var from = q._from || (SEC[q.sec] ? SEC[q.sec].title : '');
      var optsHtml = q.opts.map(function (o, j) { return '<div class="opt" data-j="' + j + '" data-q="' + esc(qid) + '"><span class="abc">' + 'ABCD'[j] + '</span><span>' + o + '</span></div>'; }).join('');
      html += '<div class="examcard" id="wq-' + idx + '"><h3 style="font-size:15.5px">' + esc(q.stem) + '</h3>' +
        '<div class="meta">来自：' + from + (q.tag ? ' · ' + q.tag : '') + '</div>' +
        '<div style="display:none" class="wq-body">' + optsHtml + '<div class="wq-exp"></div></div>' +
        '<button class="btn ghost" style="margin-top:10px" data-open="' + idx + '">重做此题</button></div>';
    });
    html += '<div class="center" style="margin:14px 0"><button class="btn ghost" id="wclear">清空错题本</button></div>';
    h(html);
    $app.querySelectorAll('[data-open]').forEach(function (b) {
      b.onclick = function () {
        var card = document.getElementById('wq-' + b.getAttribute('data-open'));
        var body = card.querySelector('.wq-body'); body.style.display = ''; b.style.display = 'none';
        var qid = card.querySelector('.opt').getAttribute('data-q');
        var q = Q[qid] || EXQ[qid];
        card.querySelectorAll('.opt').forEach(function (n) {
          n.onclick = function () {
            var j = +n.getAttribute('data-j'), ok = j === q.ans;
            card.querySelectorAll('.opt').forEach(function (m) {
              var mj = +m.getAttribute('data-j');
              if (mj === q.ans) m.classList.add('right'); else if (mj === j) m.classList.add('wrong'); else m.classList.add('dim');
            });
            card.querySelector('.wq-exp').innerHTML = '<div class="exp"><b>' + (ok ? '答对了，移出错题本 ✓' : '还是错了。') + '</b>' + q.exp + '</div>';
            if (ok) {
              P.q[qid].last = 'r'; save(); syncTab();
              setTimeout(function () { vWrong(); }, 900);
            }
          };
        });
      };
    });
    document.getElementById('wclear').onclick = function () {
      if (!confirm('确定清空错题本吗？（建议先把题都重做一遍）')) return;
      ids.forEach(function (qid) { if (P.q[qid]) P.q[qid].last = 'r'; });
      P.wrongCleared = 1; save(); checkBadges(); vWrong();
    };
  }

  /* ---------- 成就 ---------- */
  function vBadges() {
    var html = topbar('成就', '学习路上捡的"勋章"', '#/');
    html += '<div class="ch-head"><span class="tag" style="background:var(--gold)">成就</span><h2 class="kai">成就墙</h2><p>学完章节、答题、清错题、点开福鼎限定卡……都会解锁成就。</p></div><div class="badge-grid">';
    BADGES.forEach(function (b) {
      var got = !!P['bg_' + b.id];
      html += '<div class="badge' + (got ? ' got' : '') + '"><div class="ic">' + b.ic + '</div><h4>' + b.t + '</h4><p>' + b.d + '</p></div>';
    });
    html += '</div><div class="foot">攒成就，攒的是真本事</div>';
    h(html);
  }

  /* ---------- 路由 ---------- */
  function route() {
    var hash = location.hash || '#/';
    var qIdx = hash.indexOf('?');
    if (qIdx >= 0) hash = hash.slice(0, qIdx); // 兼容带查询参数的地址
    var parts = hash.replace(/^#\//, '').split('/');
    checkBadges();
    if (parts[0] === '' || parts[0] === undefined) return vHome();
    if (parts[0] === 'chapters') return vChapters();
    if (parts[0] === 'ch' && parts[1]) return vChapter(parts[1]);
    if (parts[0] === 'sec' && parts[1]) return vSection(parts[1]);
    if (parts[0] === 'exams') return vExams();
    if (parts[0] === 'exam' && parts[1]) return vExam(parts[1]);
    if (parts[0] === 'wrong') return vWrong();
    if (parts[0] === 'badges') return vBadges();
    vHome();
  }
  save();
  route();
})();

</script>
</body>
</html>
